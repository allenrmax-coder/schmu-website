<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Admin — Shmu The Cannaprophet</title>

    <style>
        /* ===== Admin-specific styles ===== */
        body { background: #9060BC !important; background-image: none !important; }

        .admin-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 80px;
            color: var(--color-cream);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 22px;
            background-color: #14101f;
            border: 2px solid var(--color-navy);
            border-radius: var(--radius-md);
            margin-bottom: 18px;
            color: var(--color-cream);
        }
        .admin-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 900;
            margin: 0;
            color: var(--color-green-bright);
            letter-spacing: 0.02em;
        }
        .admin-title small {
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--color-purple-light);
            margin-left: 8px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .admin-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-family: var(--font-display);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .admin-status.live { background: rgba(168, 125, 212, 0.18); color: var(--color-purple-light); }
        .admin-status.preview { background: rgba(121, 222, 83, 0.18); color: var(--color-green-bright); }
        .admin-status.dirty { background: rgba(241, 141, 52, 0.22); color: var(--color-orange-soft); }
        .admin-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

        .admin-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-btn {
            background-color: var(--color-cream);
            border: 2px solid var(--color-navy);
            color: var(--color-navy);
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 2px 0 var(--color-navy);
        }
        .admin-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--color-navy); }
        .admin-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--color-navy); }
        .admin-btn.primary { background-color: var(--color-green); }
        .admin-btn.danger { background-color: var(--color-orange); color: var(--color-cream); }
        .admin-btn.muted { background-color: transparent; border-color: var(--color-purple-light); color: var(--color-purple-light); box-shadow: none; }

        .admin-modes {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .admin-mode {
            background: rgba(20, 16, 31, 0.6);
            border: 2px solid rgba(168, 125, 212, 0.3);
            color: var(--color-purple-light);
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 9px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition);
            flex: 1;
        }
        .admin-mode:hover {
            background: rgba(149, 240, 103, 0.10);
            color: var(--color-green-bright);
            border-color: rgba(149, 240, 103, 0.4);
        }
        .admin-mode.active {
            background: var(--color-green);
            color: var(--color-navy);
            border-color: var(--color-navy);
            box-shadow: 0 3px 0 var(--color-navy);
        }

        .admin-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 8px;
            background-color: rgba(20, 16, 31, 0.6);
            border-radius: var(--radius-md);
            border: 1px solid rgba(168, 125, 212, 0.25);
        }

        .admin-ann-card {
            background-color: var(--color-cream);
            border: 3px solid var(--color-navy);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            margin-bottom: 16px;
            color: var(--color-navy);
            box-shadow: var(--shadow-card);
        }
        .admin-ann-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(9, 46, 109, 0.18);
            flex-wrap: wrap;
        }
        .admin-ann-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            color: var(--color-navy);
        }
        .admin-ann-header-info .date-badge {
            background: var(--color-green);
            color: var(--color-navy);
            padding: 3px 10px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--color-navy);
            font-size: 12.5px;
            letter-spacing: 0.04em;
        }
        .admin-ann-controls {
            display: inline-flex;
            gap: 4px;
        }
        .admin-ann-fields {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        @media (min-width: 720px) {
            .admin-ann-fields-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; }
        }
        .admin-ann-buttons-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }
        .admin-ann-button-row {
            display: grid;
            grid-template-columns: 2fr 2fr auto;
            gap: 6px;
            align-items: center;
        }

        /* Rich-text editor for announcement body */
        .admin-richedit-wrap {
            border: 1.5px solid rgba(9, 46, 109, 0.4);
            border-radius: var(--radius-sm);
            background: #fff;
            overflow: hidden;
        }
        .admin-richedit-wrap:focus-within {
            border-color: var(--color-green-deep);
            box-shadow: 0 0 0 3px rgba(121, 222, 83, 0.2);
        }
        .admin-richedit-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px;
            background: rgba(9, 46, 109, 0.06);
            border-bottom: 1px solid rgba(9, 46, 109, 0.15);
        }
        .admin-richedit-toolbar button {
            background: #fff;
            border: 1.5px solid rgba(9, 46, 109, 0.25);
            border-radius: 4px;
            padding: 4px 10px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 700;
            color: var(--color-navy);
            cursor: pointer;
            min-width: 32px;
            line-height: 1;
            transition: background-color var(--transition);
        }
        .admin-richedit-toolbar button:hover {
            background: var(--color-green);
            border-color: var(--color-navy);
        }
        .admin-richedit-toolbar .tb-sep {
            width: 1px;

            margin: 2px 4px;
        }
        .admin-richedit-toolbar .tb-hint {
            margin-left: auto;
            font-size: 11px;
            color: var(--color-navy-soft);
            font-weight: 500;
            padding: 6px 8px;
            font-style: italic;
        }
        .admin-richedit {
            min-height: 140px;
            max-height: 360px;
            overflow-y: auto;
            padding: 10px 12px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--color-navy);
            line-height: 1.55;
            outline: none;
        }
        .admin-richedit:empty::before {
            content: attr(data-placeholder);
            color: var(--color-navy-dim);
            font-style: italic;
            pointer-events: none;
        }
        .admin-richedit h5 {
            margin: 14px 0 4px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1rem;
            color: var(--color-purple-deep);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .admin-richedit p {
            margin: 0 0 8px;
        }
        .admin-richedit b, .admin-richedit strong { font-weight: 800; }
        .admin-richedit em, .admin-richedit i { font-style: italic; color: var(--color-navy-soft); }
        .admin-tab {
            background: transparent;
            border: none;
            color: var(--color-purple-light);
            font-family: var(--font-display);
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
        }
        .admin-tab:hover { background-color: rgba(121, 222, 83, 0.10); color: var(--color-green-bright); }
        .admin-tab.active {
            background-color: var(--color-green);
            color: var(--color-navy);
        }

        .admin-section-card {
            background-color: var(--color-cream);
            border: 3px solid var(--color-navy);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 18px;
            color: var(--color-navy);
            box-shadow: var(--shadow-card);
        }
        .admin-section-card h3 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--color-navy);
            margin: 0 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-section-meta {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        @media (min-width: 720px) {
            .admin-section-meta { grid-template-columns: 1fr 1fr; }
        }
        .admin-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .admin-field label {
            font-family: var(--font-display);
            font-size: 10.5px;
            font-weight: 800;
            color: var(--color-purple-deep);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .admin-input,
        .admin-textarea,
        .admin-select {
            width: 100%;
            padding: 7px 10px;
            background-color: #fff;
            border: 1.5px solid rgba(9, 46, 109, 0.4);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 13.5px;
            color: var(--color-navy);
            font-weight: 500;
        }
        .admin-input:focus,
        .admin-textarea:focus,
        .admin-select:focus {
            outline: none;
            border-color: var(--color-green-deep);
            box-shadow: 0 0 0 3px rgba(121, 222, 83, 0.2);
        }
        .admin-textarea {
            min-height: 50px;
            resize: vertical;
            line-height: 1.5;
        }

        .admin-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
        }
        .admin-items-table thead th {
            font-family: var(--font-display);
            font-size: 9.5px;
            font-weight: 800;
            color: var(--color-purple-deep);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid rgba(9, 46, 109, 0.18);
        }
        .admin-items-table td {
            padding: 6px 4px;
            vertical-align: top;
        }
        .admin-item-row {
            border-bottom: 1px dashed rgba(9, 46, 109, 0.15);
        }
        .admin-item-row:last-child { border-bottom: none; }
        .admin-item-row td.name-col { width: 30%; min-width: 140px; }
        .admin-item-row td.strain-col { width: 70px; }
        .admin-item-row td.detail-col { width: 22%; min-width: 100px; }
        .admin-item-row td.prices-col { min-width: 240px; }
        .admin-item-row td.actions-col { width: 60px; text-align: right; }

        .admin-prices-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .admin-price-row {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(168, 125, 212, 0.10);
            border-radius: 4px;
            padding: 2px;
        }
        .admin-price-row .admin-input { width: 70px; font-size: 12px; padding: 5px 7px; }
        .admin-price-row .admin-input.tier { width: 70px; }
        .admin-price-row .admin-input.amount { width: 80px; }

        .icon-btn {
            background: transparent;
            border: 1.5px solid rgba(9, 46, 109, 0.3);
            color: var(--color-navy);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 5px;
            padding: 3px 7px;
            transition: all var(--transition);
            line-height: 1;
        }
        .icon-btn:hover { background-color: rgba(9, 46, 109, 0.08); }
        .icon-btn.danger { color: var(--color-orange); border-color: rgba(241, 141, 52, 0.4); }
        .icon-btn.danger:hover { background-color: rgba(241, 141, 52, 0.12); }
        .icon-btn.small { font-size: 11px; padding: 2px 6px; }

        .admin-section-footer {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(9, 46, 109, 0.12);
            flex-wrap: wrap;
        }

        .admin-floating {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background-color: #14101f;
            border: 2px solid var(--color-navy);
            border-radius: var(--radius-pill);
            padding: 8px 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 200;
            max-width: calc(100% - 32px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .admin-login {
            max-width: 380px;
            margin: 80px auto;
            background: var(--color-cream);
            border: 3px solid var(--color-navy);
            border-radius: var(--radius-md);
            padding: 28px 26px;
            color: var(--color-navy);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3), 0 4px 0 var(--color-navy);
        }
        .admin-login h2 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--color-navy);
            margin: 0 0 12px;
            text-align: center;
        }
        .admin-login p {
            text-align: center;
            font-size: 13px;
            color: var(--color-navy-soft);
            margin: 0 0 16px;
        }
        .admin-login input {
            width: 100%;
            padding: 11px 14px;
            background-color: #fff;
            border: 2px solid var(--color-navy);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            color: var(--color-navy);
            outline: none;
        }
        .admin-login input:focus {
            border-color: var(--color-green-deep);
            box-shadow: 0 0 0 3px rgba(121, 222, 83, 0.2);
        }
        .admin-login button {
            width: 100%;
            margin-top: 12px;
            padding: 11px 16px;
            background-color: var(--color-green);
            border: 2px solid var(--color-navy);
            border-radius: var(--radius-sm);
            color: var(--color-navy);
            font-family: var(--font-display);
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--color-navy);
            transition: all var(--transition);
        }
        .admin-login button:hover {
            background-color: var(--color-green-bright);
            transform: translateY(-1px);
            box-shadow: 0 4px 0 var(--color-navy);
        }
        .admin-login-error {
            color: var(--color-orange);
            text-align: center;
            margin-top: 10px;
            font-size: 12.5px;
            font-weight: 600;
            min-height: 16px;
        }

        .admin-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--color-purple-light);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 12.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 18px;
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            transition: color var(--transition), background-color var(--transition);
        }
        .admin-back-link:hover {
            color: var(--color-green-bright);
            background-color: rgba(149, 240, 103, 0.10);
        }

        .admin-login-character {
            width: 170px;
            height: auto;
            margin: 22px auto 0;
            display: block;
            filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.45));
        }

        a#btn-back-site {
            display: inline-flex !important;
            align-items: center;
            text-decoration: none;
        }

        .admin-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--color-navy);
            color: var(--color-cream);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 300;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.2s, transform 0.2s;
        }
        .admin-toast.show { opacity: 1; transform: translateY(0); }
        .admin-toast.success { background: var(--color-green-deep); color: #fff; }
        .admin-toast.error { background: var(--color-orange); color: #fff; }
    </style>
</head>
<body>
    <div class="admin-shell" id="admin-login-screen" style="display:none">
        <a href="../index.html" class="admin-back-link">← Back to site</a>
        <div class="admin-login">
            <h2>Shmu Admin</h2>
            <p>Enter admin password</p>
            <form id="admin-login-form" autocomplete="off">
                <input type="password" id="admin-login-pwd" placeholder="Admin password" autofocus />
                <button type="submit">Unlock Admin</button>
                <div class="admin-login-error" id="admin-login-error"></div>
            </form>
            <img src="../assets/img/shmu_round_transparent.png" class="admin-login-character" alt="Shmu The Cannaprophet" />
        </div>
    </div>

    <div class="admin-shell" id="admin-app" style="display:none">
        <div class="admin-header">
            <div>
                <h1 class="admin-title">SHMU <small>Admin</small></h1>
            </div>
            <div class="admin-actions">
                <span class="admin-status dirty" id="admin-status" style="display:none">Unsaved changes</span>
                <a href="../index.html" class="admin-btn muted" id="btn-back-site">← Back to site</a>
                <button class="admin-btn muted" id="btn-logout">Log out</button>
            </div>
        </div>

        <div class="admin-modes" id="admin-modes">
            <button class="admin-mode active" data-mode="menu">Menu</button>
            <button class="admin-mode" data-mode="announcements">Announcements</button>
        </div>

        <div class="admin-tabs" id="admin-tabs"></div>

        <div id="admin-category-editor"></div>
        <div id="admin-announcements-editor" style="display:none"></div>

        <div class="admin-floating">
            <button class="admin-btn primary" id="btn-download" title="Download the JSON file. Upload it via FTP to assets/data/ to publish your changes.">Download JSON</button>
            <button class="admin-btn" id="btn-save-preview" title="Save changes locally — only your browser sees them. Useful for previewing before downloading.">Save Preview</button>
            <button class="admin-btn muted" id="btn-discard" title="Throw away in-memory edits, keep the last saved preview.">Discard</button>
            <button class="admin-btn danger" id="btn-clear-preview" title="Remove the local preview override and show whatever's on the server.">Clear Preview</button>
        </div>
    </div>

    <div class="admin-toast" id="admin-toast"></div>

    <script>
    // ============================================
    // SHMU ADMIN
    // Password hash is SHA-256 of the actual password.
    // To rotate the password:
    //   1. Generate a new strong password
    //   2. Compute its SHA-256 hash (e.g. printf "%s" "yourpassword" | sha256sum)
    //   3. Replace ADMIN_HASH below with the new hash
    // ============================================
    (function () {
        'use strict';

        var ADMIN_HASH = 'd0883547cf78a9225ffdbe4b4b31676cd7959dca9d60bc36666f0c4268da2855';
        var SESSION_KEY = 'shmu_admin_session';
        var MENU_KEY = 'shmu_menu_override';
        var ANN_KEY = 'shmu_announcements_override';

        // Menu state
        var liveMenu = null;
        var workingMenu = null;
        var activeCategory = 'flower';
        var menuDirty = false;

        // Announcements state
        var liveAnn = null;
        var workingAnn = null;
        var annDirty = false;

        // Top-level mode
        var activeMode = 'menu';  // 'menu' or 'announcements'

        // Convenience aliases used by old code below — keep working refs
        function workingData() { return activeMode === 'menu' ? workingMenu : workingAnn; }
        function isDirty() { return activeMode === 'menu' ? menuDirty : annDirty; }
        function setDirty(v) {
            if (activeMode === 'menu') menuDirty = v; else annDirty = v;
        }

        async function sha256(text) {
            var buf = new TextEncoder().encode(text);
            var hash = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
        }

        function showToast(msg, type) {
            var t = document.getElementById('admin-toast');
            t.textContent = msg;
            t.className = 'admin-toast show' + (type ? ' ' + type : '');
            clearTimeout(t._timer);
            t._timer = setTimeout(function() { t.classList.remove('show'); }, 2400);
        }

        // ---------- AUTH ----------
        function isAuthenticated() {
            return sessionStorage.getItem(SESSION_KEY) === '1';
        }

        function showLogin() {
            document.getElementById('admin-login-screen').style.display = 'block';
            document.getElementById('admin-app').style.display = 'none';
        }

        function showApp() {
            document.getElementById('admin-login-screen').style.display = 'none';
            document.getElementById('admin-app').style.display = 'block';
        }

        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var pwd = document.getElementById('admin-login-pwd').value.trim();
            var errEl = document.getElementById('admin-login-error');
            errEl.textContent = '';
            if (!pwd) return;
            try {
                var h = await sha256(pwd);
                if (h === ADMIN_HASH) {
                    sessionStorage.setItem(SESSION_KEY, '1');
                    showApp();
                    init();
                } else {
                    errEl.textContent = 'Incorrect password.';
                    document.getElementById('admin-login-pwd').value = '';
                }
            } catch (err) {
                errEl.textContent = 'Browser does not support hashing.';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', function() {
            if ((menuDirty || annDirty) && !confirm('You have unsaved changes. Log out anyway?')) return;
            sessionStorage.removeItem(SESSION_KEY);
            location.reload();
        });

        // btn-back-site is a normal anchor link — no JS handler needed.
        // (Confirm before leaving if dirty)
        var backLink = document.getElementById('btn-back-site');
        if (backLink) {
            backLink.addEventListener('click', function(e) {
                if (menuDirty || annDirty) {
                    if (!confirm('You have unsaved changes. Leave anyway?')) {
                        e.preventDefault();
                    }
                }
            });
        }

        // ---------- DATA ----------
        function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

        function currentStorageKey() {
            return activeMode === 'menu' ? MENU_KEY : ANN_KEY;
        }

        function hasOverride() {
            return !!localStorage.getItem(currentStorageKey());
        }

        function loadLiveMenu() {
            return fetch('../assets/data/menu.json', { cache: 'no-cache' })
                .then(function(r) {
                    if (!r.ok) throw new Error('Failed to load menu.json');
                    return r.json();
                });
        }

        function loadLiveAnn() {
            return fetch('../assets/data/announcements.json', { cache: 'no-cache' })
                .then(function(r) {
                    if (!r.ok) throw new Error('Failed to load announcements.json');
                    return r.json();
                });
        }

        function loadOverride(key) {
            try {
                var raw = localStorage.getItem(key);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) { return null; }
        }

        function updateStatus() {
            // Only show a status indicator when there are unsaved changes.
            // "Live data" / "Preview active" pills are noise — toasts already
            // confirm save/clear actions.
            var el = document.getElementById('admin-status');
            if (isDirty()) {
                el.className = 'admin-status dirty';
                el.textContent = 'Unsaved changes';
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        }

        function markDirty() {
            setDirty(true);
            updateStatus();
        }

        // ---------- MODE SWITCHING ----------
        function switchMode(mode) {
            activeMode = mode;
            document.querySelectorAll('.admin-mode').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-mode') === mode);
            });
            document.getElementById('admin-category-editor').style.display = mode === 'menu' ? '' : 'none';
            document.getElementById('admin-announcements-editor').style.display = mode === 'announcements' ? '' : 'none';
            document.getElementById('admin-tabs').style.display = mode === 'menu' ? '' : 'none';
            if (mode === 'menu') {
                renderTabs();
                renderEditor();
            } else {
                renderAnnouncementsEditor();
            }
            updateStatus();
        }

        document.querySelectorAll('.admin-mode').forEach(function(b) {
            b.addEventListener('click', function() {
                switchMode(b.getAttribute('data-mode'));
            });
        });

        // ---------- MENU RENDERER ----------
        function renderTabs() {
            var tabsEl = document.getElementById('admin-tabs');
            var cats = Object.keys(workingMenu.categories || {});
            tabsEl.innerHTML = cats.map(function(id) {
                var label = workingMenu.categories[id].title || id;
                var cls = id === activeCategory ? 'admin-tab active' : 'admin-tab';
                return '<button class="' + cls + '" data-cat="' + id + '">' + escapeHtml(label) + '</button>';
            }).join('');
            tabsEl.querySelectorAll('.admin-tab').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    activeCategory = btn.getAttribute('data-cat');
                    renderTabs();
                    renderEditor();
                });
            });
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function el(tag, props, children) {
            var e = document.createElement(tag);
            if (props) Object.keys(props).forEach(function(k) {
                if (k === 'className') e.className = props[k];
                else if (k === 'on') Object.keys(props[k]).forEach(function(ev){ e.addEventListener(ev, props[k][ev]); });
                else if (k === 'html') e.innerHTML = props[k];
                else e.setAttribute(k, props[k]);
            });
            if (children) (Array.isArray(children) ? children : [children]).forEach(function(c) {
                if (c == null) return;
                if (typeof c === 'string') e.appendChild(document.createTextNode(c));
                else e.appendChild(c);
            });
            return e;
        }

        function renderEditor() {
            var container = document.getElementById('admin-category-editor');
            container.innerHTML = '';
            var category = workingMenu.categories[activeCategory];
            if (!category) return;

            // Category-level metadata
            var meta = el('div', { className: 'admin-section-card' }, [
                el('h3', null, 'Category info'),
                el('div', { className: 'admin-section-meta' }, [
                    field('Title', category.title, function(v) { category.title = v; markDirty(); }),
                    field('Subtitle', category.subtitle, function(v) { category.subtitle = v; markDirty(); })
                ])
            ]);
            container.appendChild(meta);

            // Sections
            (category.sections || []).forEach(function(section, sIdx) {
                container.appendChild(renderSectionEditor(category, section, sIdx));
            });

            // Add section button
            var addBtn = el('button', {
                className: 'admin-btn primary',
                on: { click: function() {
                    if (!category.sections) category.sections = [];
                    category.sections.push({ title: 'New Section', items: [] });
                    markDirty();
                    renderEditor();
                }}
            }, '+ Add Section');
            container.appendChild(addBtn);
        }

        function field(label, value, onChange, type) {
            var input = el('input', {
                className: 'admin-input',
                type: type || 'text',
                value: value == null ? '' : value
            });
            input.addEventListener('input', function() { onChange(input.value); });
            return el('div', { className: 'admin-field' }, [
                el('label', null, label),
                input
            ]);
        }

        function textareaField(label, value, onChange) {
            var ta = el('textarea', { className: 'admin-textarea' });
            ta.value = value || '';
            ta.addEventListener('input', function() { onChange(ta.value); });
            return el('div', { className: 'admin-field' }, [
                el('label', null, label),
                ta
            ]);
        }

        // Rich-text editor — contenteditable + a tiny toolbar.
        // Admin types like a normal document; toolbar buttons apply
        // bold/italic/underline/heading. No HTML knowledge required.
        function richField(label, htmlValue, onChange, placeholder) {
            var wrap = el('div', { className: 'admin-richedit-wrap' });
            var toolbar = el('div', { className: 'admin-richedit-toolbar' });
            var editor = el('div', {
                className: 'admin-richedit',
                contenteditable: 'true',
                'data-placeholder': placeholder || 'Start typing…'
            });
            editor.innerHTML = htmlValue || '';

            function exec(cmd, val) {
                editor.focus();
                document.execCommand(cmd, false, val || null);
                // After applying, trigger input so onChange fires
                editor.dispatchEvent(new Event('input', { bubbles: true }));
            }

            function tbBtn(labelHtml, cmd, val, title) {
                var b = el('button', { type: 'button', title: title || cmd });
                b.innerHTML = labelHtml;
                // Use mousedown so the editor doesn't lose its selection
                b.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    exec(cmd, val);
                });
                return b;
            }

            toolbar.appendChild(tbBtn('<b>B</b>', 'bold', null, 'Bold (Ctrl+B)'));
            toolbar.appendChild(tbBtn('<i>I</i>', 'italic', null, 'Italic (Ctrl+I)'));
            toolbar.appendChild(tbBtn('<u>U</u>', 'underline', null, 'Underline (Ctrl+U)'));
            toolbar.appendChild(el('span', { className: 'tb-sep' }));
            toolbar.appendChild(tbBtn('Heading', 'formatBlock', '<h5>', 'Section heading'));
            toolbar.appendChild(tbBtn('Paragraph', 'formatBlock', '<p>', 'Plain paragraph'));
            toolbar.appendChild(el('span', { className: 'tb-sep' }));
            toolbar.appendChild(tbBtn('Clear style', 'removeFormat', null, 'Remove formatting'));
            toolbar.appendChild(el('span', { className: 'tb-hint' }, 'Just type — use the buttons to format'));

            editor.addEventListener('input', function() {
                onChange(editor.innerHTML);
            });
            // Strip styles from pasted text — keep it clean
            editor.addEventListener('paste', function(e) {
                e.preventDefault();
                var text = (e.clipboardData || window.clipboardData).getData('text/plain');
                document.execCommand('insertText', false, text);
            });

            wrap.appendChild(toolbar);
            wrap.appendChild(editor);

            return el('div', { className: 'admin-field' }, [
                el('label', null, label),
                wrap
            ]);
        }

        function renderSectionEditor(category, section, sIdx) {
            var card = el('div', { className: 'admin-section-card' });
            var titleEl = el('h3', null, [section.title || 'Untitled section']);

            var moveUp = el('button', {
                className: 'icon-btn small',
                title: 'Move up',
                on: { click: function() {
                    if (sIdx === 0) return;
                    var tmp = category.sections[sIdx - 1];
                    category.sections[sIdx - 1] = category.sections[sIdx];
                    category.sections[sIdx] = tmp;
                    markDirty(); renderEditor();
                }}
            }, '↑');
            var moveDown = el('button', {
                className: 'icon-btn small',
                title: 'Move down',
                on: { click: function() {
                    if (sIdx >= category.sections.length - 1) return;
                    var tmp = category.sections[sIdx + 1];
                    category.sections[sIdx + 1] = category.sections[sIdx];
                    category.sections[sIdx] = tmp;
                    markDirty(); renderEditor();
                }}
            }, '↓');
            var del = el('button', {
                className: 'icon-btn small danger',
                title: 'Delete section',
                on: { click: function() {
                    if (!confirm('Delete this section? Items inside will also be deleted.')) return;
                    category.sections.splice(sIdx, 1);
                    markDirty(); renderEditor();
                }}
            }, 'Delete');

            var controls = el('div', { style: 'display:inline-flex; gap:4px; margin-left:auto' }, [moveUp, moveDown, del]);
            titleEl.appendChild(controls);
            card.appendChild(titleEl);

            // Title + Description fields
            card.appendChild(el('div', { className: 'admin-section-meta' }, [
                field('Section title', section.title, function(v) { section.title = v; titleEl.firstChild.textContent = v || 'Untitled section'; markDirty(); }),
                field('Add-on text (optional)', section.addOn, function(v) { section.addOn = v; markDirty(); })
            ]));
            card.appendChild(textareaField('Description (optional)', section.description, function(v) { section.description = v; markDirty(); }));
            card.appendChild(textareaField('Note (shown in bottom box)', section.note, function(v) { section.note = v; markDirty(); }));

            // Items table
            var table = el('table', { className: 'admin-items-table' });
            table.appendChild(el('thead', null, el('tr', null, [
                el('th', null, 'Name'),
                el('th', null, 'Strain'),
                el('th', null, 'Detail'),
                el('th', null, 'Prices (tier / amount)'),
                el('th', null, '')
            ])));
            var tbody = el('tbody');
            (section.items || []).forEach(function(item, iIdx) {
                tbody.appendChild(renderItemRow(section, item, iIdx));
            });
            table.appendChild(tbody);
            card.appendChild(table);

            // Add item / Add price buttons
            card.appendChild(el('div', { className: 'admin-section-footer' }, [
                el('button', {
                    className: 'admin-btn',
                    on: { click: function() {
                        if (!section.items) section.items = [];
                        section.items.push({ name: 'New item', prices: [] });
                        markDirty();
                        renderEditor();
                    }}
                }, '+ Add Item')
            ]));

            return card;
        }

        function renderItemRow(section, item, iIdx) {
            var tr = el('tr', { className: 'admin-item-row' });

            var nameInput = el('input', { className: 'admin-input', type: 'text', value: item.name || '' });
            nameInput.addEventListener('input', function() { item.name = nameInput.value; markDirty(); });
            tr.appendChild(el('td', { className: 'name-col' }, nameInput));

            var strainSel = el('select', { className: 'admin-select' });
            ['', 'S', 'I', 'H'].forEach(function(opt) {
                var o = el('option', null, opt || '—');
                o.value = opt;
                if ((item.strain || '') === opt) o.selected = true;
                strainSel.appendChild(o);
            });
            strainSel.addEventListener('change', function() { item.strain = strainSel.value || undefined; markDirty(); });
            tr.appendChild(el('td', { className: 'strain-col' }, strainSel));

            var detailInput = el('input', { className: 'admin-input', type: 'text', value: item.detail || '' });
            detailInput.addEventListener('input', function() { item.detail = detailInput.value || undefined; markDirty(); });
            tr.appendChild(el('td', { className: 'detail-col' }, detailInput));

            // Prices
            var pricesWrap = el('div', { className: 'admin-prices-list' });
            (item.prices || []).forEach(function(price, pIdx) {
                var row = el('div', { className: 'admin-price-row' });
                var tier = el('input', { className: 'admin-input tier', type: 'text', placeholder: 'tier', value: price.tier || '' });
                var amt = el('input', { className: 'admin-input amount', type: 'text', placeholder: 'amount', value: price.amount || '' });
                tier.addEventListener('input', function() { price.tier = tier.value; markDirty(); });
                amt.addEventListener('input', function() { price.amount = amt.value; markDirty(); });
                var rm = el('button', {
                    className: 'icon-btn danger small',
                    on: { click: function() {
                        item.prices.splice(pIdx, 1);
                        markDirty();
                        renderEditor();
                    }}
                }, '×');
                row.appendChild(tier);
                row.appendChild(amt);
                row.appendChild(rm);
                pricesWrap.appendChild(row);
            });
            var addPriceBtn = el('button', {
                className: 'icon-btn small',
                on: { click: function() {
                    if (!item.prices) item.prices = [];
                    item.prices.push({ tier: '', amount: '' });
                    markDirty();
                    renderEditor();
                }}
            }, '+ Price');
            pricesWrap.appendChild(addPriceBtn);
            tr.appendChild(el('td', { className: 'prices-col' }, pricesWrap));

            var delBtn = el('button', {
                className: 'icon-btn danger small',
                on: { click: function() {
                    if (!confirm('Delete "' + (item.name || 'item') + '"?')) return;
                    section.items.splice(iIdx, 1);
                    markDirty();
                    renderEditor();
                }}
            }, 'Delete');
            tr.appendChild(el('td', { className: 'actions-col' }, delBtn));

            return tr;
        }

        // ---------- ANNOUNCEMENTS RENDERER ----------
        function renderAnnouncementsEditor() {
            var container = document.getElementById('admin-announcements-editor');
            container.innerHTML = '';
            var data = workingAnn;
            if (!data) return;
            if (!data.announcements) data.announcements = [];

            // Meta fields
            var meta = el('div', { className: 'admin-section-card' }, [
                el('h3', null, 'Page text'),
                el('div', { className: 'admin-section-meta' }, [
                    field('Subtitle (top of page)', data.subtitle, function(v){ data.subtitle = v; markDirty(); }),
                    field('Footer note', data.footerNote, function(v){ data.footerNote = v; markDirty(); })
                ])
            ]);
            container.appendChild(meta);

            // New + count
            var header = el('div', { className: 'admin-section-card' }, [

        // ---------- ACTIONS ----------
        document.getElementById('btn-save-preview').addEventListener('click', function() {
            try {
                var key = currentStorageKey();
                var data = activeMode === 'menu' ? workingMenu : workingAnn;
                localStorage.setItem(key, JSON.stringify(data));
                setDirty(false);
                updateStatus();
                var label = activeMode === 'menu' ? 'menu' : 'announcements';
                showToast('Preview saved — ' + label + ' page will show your changes', 'success');
            } catch (e) {
                showToast('Failed to save: ' + e.message, 'error');
            }
        });

        document.getElementById('btn-discard').addEventListener('click', function() {
            if (!isDirty()) {
                showToast('No unsaved changes');
                return;
            }
            if (!confirm('Discard all unsaved changes in this view?')) return;
            var key = currentStorageKey();
            if (activeMode === 'menu') {
                workingMenu = deepClone(loadOverride(key) || liveMenu);
                renderTabs(); renderEditor();
            } else {
                workingAnn = deepClone(loadOverride(key) || liveAnn);
                renderAnnouncementsEditor();
            }
            setDirty(false);
            updateStatus();
            showToast('Changes discarded');
        });

        document.getElementById('btn-clear-preview').addEventListener('click', function() {
            if (!confirm('Remove the preview override for this view and go back to live data?')) return;
            var key = currentStorageKey();
            localStorage.removeItem(key);
            if (activeMode === 'menu') {
                workingMenu = deepClone(liveMenu);
                renderTabs(); renderEditor();
            } else {
                workingAnn = deepClone(liveAnn);
                renderAnnouncementsEditor();
            }
            setDirty(false);
            updateStatus();
            showToast('Preview cleared — live data restored', 'success');
        });

        document.getElementById('btn-download').addEventListener('click', function() {
            var data = activeMode === 'menu' ? workingMenu : workingAnn;
            var filename = activeMode === 'menu' ? 'menu.json' : 'announcements.json';

            data.lastUpdated = new Date().toISOString().slice(0, 10);

            try {
                var json = JSON.stringify(data, null, 2);
                var blob = new Blob([json], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 100);
                showToast('Downloaded ' + filename + ' — upload it to assets/data/ via FTP', 'success');
            } catch (e) {
                showToast('Download failed: ' + e.message, 'error');
            }
        });

        // ---------- INIT ----------
        function init() {
            Promise.all([loadLiveMenu(), loadLiveAnn()])
                .then(function(results) {
                    liveMenu = results[0];
                    liveAnn = results[1];
                    var menuOver = loadOverride(MENU_KEY);
                    var annOver = loadOverride(ANN_KEY);
                    workingMenu = deepClone(menuOver || liveMenu);
                    workingAnn = deepClone(annOver || liveAnn);
                    menuDirty = false;
                    annDirty = false;
                    switchMode('menu');
                })
                .catch(function(err) {
                    showToast('Failed to load data: ' + err.message, 'error');
                });
        }

        window.addEventListener('beforeunload', function(e) {
            if (menuDirty || annDirty) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Start
        if (isAuthenticated()) {
            showApp();
            init();
        } else {
            showLogin();
        }
    })();
    </script>
</body>
</html>
