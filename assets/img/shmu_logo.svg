<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="Shmu The Cannaprophet">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#95d5b2"/>
      <stop offset="0.5" stop-color="#52b788"/>
      <stop offset="1" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c060"/>
      <stop offset="1" stop-color="#a8741a"/>
