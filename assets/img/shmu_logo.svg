    <text x="300" y="215" text-anchor="middle"
          font-family="'Outfit', sans-serif" font-weight="900" font-size="56"
          fill="url(#g2)" stroke="#1b4332" stroke-width="3">THE CANNAPROPHET</text>
  </g>
